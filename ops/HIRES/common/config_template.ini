[global]
# All input and output files are stored in this directory
workdir = WORKDIR_PLACEHOLDER/
# Queue: a single (telescope + instrument) identifier. One of: hirescps, kpfcc.
# See astroq.queue.QUEUE_REGISTRY for the up-to-date list. The queue owns the
# observatory location, slew model, pointing limits, and starlist writer; the
# old separate [global] observatory + [global] instrument fields are gone.
queue = hirescps
# Today's date
current_day = CURRENT_DATE_PLACEHOLDER
# Semester start date
semester_start_day = START_DATE_PLACEHOLDER
# Semester end date
semester_end_day = END_DATE_PLACEHOLDER
# Semester ID
semester = SEMESTER_PLACEHOLDER
# Hours difference: local time minus UT (negative = local behind UT, e.g. -10 for HST)
UTCoffset = -10

[data]
# name of allocation file 
allocation_file = allocation.csv
# name of past history file 
past_file = past.csv
# name of the programs file
programs_file = programs.csv
# name of request file 
request_file = request.csv
# name of custom file 
custom_file = custom.csv
# name of filler file
filler_file = fillers.csv

[semester]
# Size of one slot, in minutes, this must be comparable to the shortest visit + overhead time
slot_size = 2
# Specify a random seed. In the paper for weather testing, we use 24 through 33
random_seed = 24
# Scheduling mode: round1 (Round 1 only) or full (Rounds 1-5)
mode = full
# Allow global weighted shortfall up to this multiple of Round-1 optimum (1.1 = +10%)
global_shortfall_slack = 1.1
# % gap between optimal and current solution to stop the solve
max_solve_gap = 0.005
# Maximum time that can be spent solving the model
max_solve_time = 300
# Solve method (required): milp | norel+milp
#   milp        - Gurobi only (warmstart_time ignored)
#   norel+milp  - Gurobi NoRel heuristic, then MILP
method = norel+milp
# Seconds for NoRel warm-start phase (0 for plain milp)
warmstart_time = 30
# Show the Gurobi output in the terminal (all rounds; set show_gurobi_output_later_rounds to override rounds 2+)
show_gurobi_output = True
# Presolve on bonus rounds 2+ (-1=auto, 0=off, 1=conservative, 2=aggressive)
presolve_later_rounds = 1
# Conversion between awarded nights and total hours
hours_per_night = 12.0

[night]
# TTP solve method: milp | acs8+milp | norel+milp | auto
#   milp        - Gurobi only (warmstart_time ignored)
#   acs8+milp   - 8 parallel ACS warm starts, then Gurobi
#   norel+milp  - Gurobi NoRel heuristic, then MILP
#   auto        - milp if n_targets < 20, else acs8+milp
method = auto
# Cable-wrap states: 1 = legacy single-cut; 2 = HIRES N/S encoder model
n_states = 2
# Seconds for ACS or NoRel warm-start phase (0 for plain milp)
warmstart_time = 30
# Total solve budget (seconds); MILP gets max_solve_time - warmstart_time when warm start runs
max_solve_time = 120
# % gap between optimal and current solution to stop the solve
max_solve_gap = 0.005
# Show the Gurobi output in the terminal
show_gurobi_output = True